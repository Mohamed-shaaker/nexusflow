{{/*
=============================================================================
NexusFlow — templates/secret.yaml
=============================================================================
Helm-managed Secret — only rendered when secrets.createSecret=true.
For production use Sealed Secrets, External Secrets Operator, or
AWS Secrets Manager CSI and set createSecret=false.

Values are stored as plain text in values.yaml and base64-encoded here
via the Helm `b64enc` function so you never have to pre-encode them.
=============================================================================
*/}}
{{- if .Values.secrets.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexusflow.secretName" . }}
  namespace: {{ include "nexusflow.namespace" . }}
  labels:
    {{- include "nexusflow.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  POSTGRES_USER:     {{ .Values.secrets.postgresUser     | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  DATABASE_URL:      {{ .Values.secrets.databaseUrl      | b64enc | quote }}
  REDIS_URL:         {{ .Values.secrets.redisUrl         | b64enc | quote }}
{{- end }}
