# =============================================================================
# NexusFlow — docker-compose.yml
# =============================================================================
# Local development environment that wires together all four services:
#
#   postgres  ─── persistent relational store (future use)
#   redis     ─── task stream (Redis Streams, consumed by the worker)
#   gateway   ─── FastAPI HTTP entry point  (builds from ./gateway)
#   worker    ─── background task consumer  (builds from ./worker)
#
# Usage:
#   docker compose up --build          # first run / after code changes
#   docker compose up -d               # detached mode
#   docker compose logs -f gateway     # tail a single service
#   docker compose down -v             # stop and remove volumes (clean slate)
# =============================================================================

name: nexusflow

# ---------------------------------------------------------------------------
# Named volumes — data persists across container restarts and recreations.
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ---------------------------------------------------------------------------
# Shared network — all services communicate by service-name DNS resolution.
# Using a custom bridge network isolates NexusFlow from other compose projects.
# ---------------------------------------------------------------------------
networks:
  nexusflow_net:
    driver: bridge

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine          # Alpine keeps the image small
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexuspassword}
      POSTGRES_DB:       ${POSTGRES_DB:-nexusflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data   # persist DB files
    networks:
      - nexusflow_net
    healthcheck:
      # pg_isready exits 0 only when the server is accepting connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexusflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s     # grace period before health checks begin

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
    # appendonly + everysec: AOF persistence — at most one second of data loss
    # on a hard crash, with minimal performance overhead.
    volumes:
      - redis_data:/data                         # persist AOF / RDB files
    networks:
      - nexusflow_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Gateway (FastAPI) ─────────────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"                  # host:container — access via localhost:8000
    networks:
      - nexusflow_net
    environment:
      # ---- Redis ----
      REDIS_HOST: redis              # service-name DNS resolution on nexusflow_net
      REDIS_PORT: 6379
      STREAM_NAME: tasks
      # ---- PostgreSQL ----
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     5432
      POSTGRES_USER:     ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexuspassword}
      POSTGRES_DB:       ${POSTGRES_DB:-nexusflow}
      # ---- App ----
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy   # wait until pg_isready passes
      redis:
        condition: service_healthy   # wait until redis-cli ping passes
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Worker ────────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - nexusflow_net
    environment:
      # ---- Redis (must match gateway so both use the same stream) ----
      REDIS_HOST:     redis
      REDIS_PORT:     6379
      STREAM_NAME:    tasks
      CONSUMER_GROUP: workers
      CONSUMER_NAME:  worker-1       # override per replica: worker-2, worker-3…
      BLOCK_MS:       2000
      # ---- App ----
      APP_ENV: development
    depends_on:
      redis:
        condition: service_healthy   # worker only needs Redis, not postgres
