# =============================================================================
# NexusFlow — k8s/base/worker-deployment.yaml
# =============================================================================
# Python background consumer: reads from Redis Streams via XREADGROUP,
# processes tasks, persists state to PostgreSQL, and runs the PEL reclaim loop.
#
# Key design decisions:
#  • Each pod gets a unique CONSUMER_NAME via the Downward API (pod name).
#    This ensures the Redis consumer group can track per-pod PEL entries
#    and reclaim orphaned messages when a pod is evicted.
#  • terminationGracePeriodSeconds gives the current task time to finish
#    before the pod is killed (the _shutdown flag in worker.py is SIGTERM-aware).
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: nexusflow
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: nexusflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: nexusflow
    spec:
      # Allow time for the current task to finish on SIGTERM.
      # Must be larger than REQUEUE_MAX_DELAY_MS/1000 + max task duration.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for postgres..."; sleep 2;
              done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379; do
                echo "Waiting for redis..."; sleep 2;
              done
        # Wait for the db-migrate Job to reach Succeeded status before
        # starting the worker — guarantees the tasks table exists.
        - name: wait-for-migration
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for db-migrate Job to complete..."
              until kubectl get job db-migrate -n nexusflow \
                    -o jsonpath='{.status.succeeded}' 2>/dev/null | grep -q "1"; do
                echo "Migration not yet complete, retrying in 3s..."; sleep 3;
              done
              echo "Migration complete — starting worker."
      containers:
        - name: worker
          # TODO: replace with your registry image, e.g.:
          #   image: 123456789.dkr.ecr.us-east-1.amazonaws.com/nexusflow-worker:latest
          image: nexusflow/worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: nexusflow-config
          env:
            # --- Secrets ---
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nexusflow-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexusflow-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexusflow-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: nexusflow-secrets
                  key: REDIS_URL
            # --- Downward API: use pod name as unique consumer name ---
            # Each replica gets a stable, unique identity in the Redis consumer
            # group so orphaned PEL entries can be attributed to the crashed pod.
            - name: CONSUMER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            # Workers have no HTTP endpoint; probe the process via exec.
            # worker.py is launched via exec-form CMD so it is PID 1 in the
            # container. kill -0 is a shell builtin (no procps/pgrep needed)
            # that checks whether PID 1 is alive without sending any signal.
            exec:
              command:
                - sh
                - -c
                - "kill -0 1"
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
