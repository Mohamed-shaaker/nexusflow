# =============================================================================
# NexusFlow — k8s/base/secrets-template.yaml
# =============================================================================
# TEMPLATE ONLY — DO NOT apply this file directly.
#
# Replace every <BASE64_...> placeholder with a valid base64-encoded value
# before applying, or use a secrets management solution:
#   - Sealed Secrets (Bitnami):  kubeseal
#   - External Secrets Operator: ExternalSecret CR pointing to AWS SSM / Vault
#   - AWS Secrets Manager CSI:   SecretProviderClass
#
# Generate a base64 value:
#   echo -n "your-secret-value" | base64
#
# Apply the resolved secret (never commit the resolved file to git):
#   kubectl apply -f secrets-resolved.yaml
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: nexusflow-secrets
  namespace: nexusflow
  labels:
    app.kubernetes.io/part-of: nexusflow
  annotations:
    # Remind operators this file is a template, not live configuration.
    nexusflow/secret-type: template
type: Opaque
data:
  # PostgreSQL credentials
  # echo -n "nexus" | base64  →  bmV4dXM=
  POSTGRES_USER:     <BASE64_POSTGRES_USER>
  # echo -n "change-me-in-production" | base64
  POSTGRES_PASSWORD: <BASE64_POSTGRES_PASSWORD>

  # Full DSN consumed by asyncpg / psycopg2.
  # Format: postgresql://USER:PASSWORD@HOST:PORT/DB
  # echo -n "postgresql://nexus:change-me-in-production@postgres:5432/nexusflow" | base64
  DATABASE_URL: <BASE64_DATABASE_URL>

  # Redis URL (no auth in base template; add :password@ if Redis AUTH is on)
  # echo -n "redis://redis:6379/0" | base64
  REDIS_URL: <BASE64_REDIS_URL>
