# =============================================================================
# NexusFlow — k8s/base/kustomization.yaml
# =============================================================================
# This is the base Kustomize layer. Overlays (local/, eks/) reference this
# base and add/modify resources via patches, replacements, and generators.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexusflow

commonLabels:
  app.kubernetes.io/part-of: nexusflow
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets-template.yaml
  - postgres-statefulset.yaml
  - redis-deployment.yaml
  - gateway-deployment.yaml
  - worker-deployment.yaml
