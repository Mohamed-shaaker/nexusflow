# =============================================================================
# NexusFlow — k8s/base/gateway-deployment.yaml
# =============================================================================
# FastAPI HTTP gateway: accepts task submissions, proxies to Redis stream,
# and exposes task-status query endpoints.
#
# Resources:
#   1. Deployment   — 2 replicas, rolling update
#   2. Service      — ClusterIP (overridden to LoadBalancer in EKS overlay)
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: nexusflow
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: nexusflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # zero-downtime deploys
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: nexusflow
      annotations:
        # Force pod restart when ConfigMap or Secret changes (via rollout restart).
        # Remove these annotations if using a secret reload sidecar instead.
        checksum/config: "placeholder-updated-by-helm-or-ci"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Init container waits until Postgres and Redis are reachable before
      # starting the gateway — mirrors the depends_on healthcheck in compose.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for postgres..."; sleep 2;
              done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379; do
                echo "Waiting for redis..."; sleep 2;
              done
        # Wait for the db-migrate Job to reach Succeeded status before
        # starting the gateway — guarantees the tasks table exists.
        - name: wait-for-migration
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for db-migrate Job to complete..."
              until kubectl get job db-migrate -n nexusflow \
                    -o jsonpath='{.status.succeeded}' 2>/dev/null | grep -q "1"; do
                echo "Migration not yet complete, retrying in 3s..."; sleep 3;
              done
              echo "Migration complete — starting gateway."
      containers:
        - name: gateway
          # Local minikube image — built with:
          #   docker build -t nexusflow-gateway:latest ./gateway
          #   minikube image load nexusflow-gateway:latest
          image: nexusflow-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nexusflow-config
          env:
            # Inject secrets individually so they are not exposed in env dumps.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nexusflow-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexusflow-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexusflow-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: nexusflow-secrets
                  key: REDIS_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-patch
              mountPath: /app/db.py
              subPath: db.py
              readOnly: true
      volumes:
        # Writable /tmp scratch space while keeping root FS read-only.
        - name: tmp
          emptyDir: {}
        # Patched db.py with JSONB fix — mounted over the image's read-only /app/db.py
        - name: db-patch
          configMap:
            name: gateway-db-patch

---
# ---------------------------------------------------------------------------
# Service — ClusterIP (base). Overridden to LoadBalancer in eks overlay.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: nexusflow
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: nexusflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
